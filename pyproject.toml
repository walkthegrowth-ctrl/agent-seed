[project]
name = "agent-seed"
version = "0.1.0"
description = "Ultra minimalistic LLM chatbot with tool calling: HTTP/SSE backend + REPL frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=2.16",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
agent-seed = "agent_seed.backends.http.cli:serve"
agent-repl = "agent_seed.frontends.repl.cli:main"
agent-compose = "agent_seed.composer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_seed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]
